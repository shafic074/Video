<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Proxy Generator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #121212; color: white; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; font-size: 16px;}
        button { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%;}
        #result { margin-top: 20px; word-wrap: break-word; background: #222; padding: 15px; border-radius: 5px; display: none; }
        a { color: #4da3ff; }
    </style>
</head>
<body>
    <h2>Video Link Generator</h2>
    <p>Paste your long .mp4 link below:</p>
    <input type="text" id="videoUrl" placeholder="https://fun.reelplexi.com/...">
    <button onclick="generateLink()">Generate Shareable Link</button>
    
    <div id="result">
        <p><strong>Your Link:</strong></p>
        <a id="finalLink" href="#" target="_blank"></a>
    </div>

    <script>
        function generateLink() {
            const originalUrl = document.getElementById('videoUrl').value;
            if (originalUrl) {
                const baseUrl = window.location.origin;
                const proxyLink = baseUrl + '/api/proxy?url=' + encodeURIComponent(originalUrl);
                
                const linkElement = document.getElementById('finalLink');
                linkElement.innerText = proxyLink;
                linkElement.href = proxyLink;
                
                document.getElementById('result').style.display = 'block';
            } else {
                alert("Please paste a link first!");
            }
        }
    </script>
</body>
</html>
